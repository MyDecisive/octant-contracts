name: Version Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            gen:
              - go/**
              - ts/**
            version:
              - version.yaml
      - name: Version Check
        if: steps.changed-files.outputs.gen_any_changed == 'true' && steps.changed-files.outputs.version_any_changed == 'false'
        run: |
          echo "No changes detected to the version.yaml file. Please update the version." && exit 1