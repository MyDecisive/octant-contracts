version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/MyDecisive/octant-contracts/go/pkg
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/protocolbuffers/wellknowntypes
    - module: buf.build/bufbuild/protovalidate
      file_option: go_package
plugins:
  - remote: buf.build/protocolbuffers/go
    out: go/pkg
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: go/pkg
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.11.0
    out: ts/dist
    opt: target=ts
    include_imports: true
  - local: protoc-gen-connect-openapi
    out: swagger
    strategy: all
    opt:
      - format=yaml
      - allow-get
      - path=octant_swagger.yaml
      - features=connectrpc
      - short-service-tags
      - with-streaming
#  - local: protoc-gen-openapiv2
#    out: swagger
#    strategy: all
#    opt:
#      - allow_merge=true
#      - merge_file_name=octant_docs
#      - json_names_for_fields=true # Ensures field names match Connect's JSON camelCase output
#      - generate_unbound_methods=true
inputs:
  - directory: proto