syntax = "proto3";

package octant.v1alpha;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";

// ArgoCDService provides an interface for managing an argo cd integration.
service ArgoCDService {
  // SetTotalAutomationSlots sets the total number of available slots for running concurrent orchestration tasks.
  rpc TestConnection(ArgoConnectionDetails) returns (TestConnectionResponse) {}
  // SaveArgoConnection saves the argo connection details.
  rpc SaveArgoConnection(ArgoConnectionDetails) returns (google.protobuf.Empty) {}
}

message ArgoConnectionDetails {
  // argo_endpoint is the endpoint to the argo cd cluster to communicate with.
  string argo_endpoint = 1 [(buf.validate.field).required = true];
  // argo_account_token is the generated token for the account to use for communicating with the argo cd API.
  string argo_account_token = 2 [(buf.validate.field).required = true];
}

message TestConnectionResponse {
  // success indicates whether the operation was succesful or not.
  bool success = 1;
}
